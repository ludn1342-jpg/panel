<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página No Encontrada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c8c8e8;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px solid #2a2a4e;
            max-width: 500px;
        }
        .icon { font-size: 72px; margin-bottom: 20px; }
        h1 { font-size: 48px; color: #f7c948; margin-bottom: 10px; }
        p { color: #8b8ba8; margin-bottom: 20px; line-height: 1.6; }
        .code { font-family: monospace; color: #4ade80; font-size: 14px; }
        hr { border: 1px solid #2a2a4e; margin: 20px 0; }
        .footer { font-size: 12px; color: #6a6a8a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔍</div>
        <h1>404</h1>
        <h2 style="color: #fff; font-size: 18px; margin-bottom: 10px;">Página No Encontrada</h2>
        <p>El recurso que buscas no está disponible o ha sido movido.</p>
        <div class="code">Error: NOT_FOUND</div>
        <hr>
        <div class="footer">🔐 Panel Seguro - Todos los intentos son registrados</div>
    </div>
</body>
</html>
